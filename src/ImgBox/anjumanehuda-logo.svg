<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="250" cy="250" r="236" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  
  <!-- Outer Arch -->
  <path d="M 70 240 A 180 180 0 0 1 430 240" fill="none" stroke="url(#archGrad)" stroke-width="14" stroke-linecap="round" />
  <path d="M 95 240 A 155 155 0 0 1 405 240" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Arch Text: ANJUMAN-E-HUDA -->
  <path id="archTextPath" d="M 80 236 A 170 170 0 0 1 420 236" fill="none" />
  <text font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="28" font-weight="900" fill="#0369a1" letter-spacing="7">
    <textPath href="#archTextPath" startOffset="50%" text-anchor="middle">
      ANJUMAN-E-HUDA
    </textPath>
  </text>

  <!-- Central Fountain Pen Nib -->
  <g transform="translate(250, 155)" filter="url(#shadow)">
    <!-- Nib tip -->
    <path d="M 0 0 L 16 38 L 13 80 L -13 80 L -16 38 Z" fill="url(#primaryGrad)" />
    <!-- Nib slit & breather hole -->
    <line x1="0" y1="0" x2="0" y2="40" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="0" cy="40" r="4.5" fill="#ffffff" />
    <!-- Pen collar / grip -->
    <rect x="-16" y="80" width="32" height="12" rx="3" fill="#0f766e" />
    <rect x="-12" y="92" width="24" height="8" rx="2" fill="#0284c7" />
  </g>

  <!-- Open Book Emblem -->
  <g transform="translate(250, 290)">
    <!-- Book Left Page -->
    <path d="M -10 10 C -60 -20, -140 -15, -170 15 C -170 15, -130 65, -10 45 Z" fill="#0891b2" opacity="0.9" />
    <path d="M -8 18 C -55 -10, -130 -5, -155 20 C -155 20, -120 60, -8 40 Z" fill="#ffffff" opacity="0.95" />
    
    <!-- Book Right Page -->
    <path d="M 10 10 C 60 -20, 140 -15, 170 15 C 170 15, 130 65, 10 45 Z" fill="#0d9488" opacity="0.9" />
    <path d="M 8 18 C 55 -10, 130 -5, 155 20 C 155 20, 120 60, 8 40 Z" fill="#ffffff" opacity="0.95" />
    
    <!-- Center spine -->
    <path d="M 0 5 L 0 50" stroke="#047857" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Stylized Arabic Calligraphy Banner "هدى انجمن" -->
  <g transform="translate(250, 325)" text-anchor="middle">
    <rect x="-160" y="-20" width="320" height="58" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="3" filter="url(#shadow)" />
    <text font-family="'Amiri', 'Traditional Arabic', serif" font-size="34" font-weight="bold" fill="#0f766e" x="0" y="20">
      هُـدَى أَنْـجُـمَـن
    </text>
  </g>

  <!-- Bottom Crest & University Title -->
  <g transform="translate(250, 420)">
    <rect x="-190" y="-18" width="380" height="42" rx="10" fill="#0f766e" filter="url(#shadow)" />
    <text font-family="'Amiri', 'Traditional Arabic', serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" x="0" y="11">
      جَامِعَةُ دَارِ الْهُدَى الْإِسْلَامِيَّةِ (CHS)
    </text>
  </g>
</svg>
